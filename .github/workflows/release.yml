name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to release. Leave empty when running from a pushed tag."
        required: false
        type: string
      draft:
        description: "Create draft GitHub release"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark GitHub release as prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build and publish with fastlane
        env:
          MANUAL_TAG_NAME: ${{ inputs.tag_name }}
          FASTLANE_DRAFT_RELEASE: ${{ inputs.draft }}
          FASTLANE_PRERELEASE: ${{ inputs.prerelease }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GITHUB_API_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: bundle exec fastlane android release